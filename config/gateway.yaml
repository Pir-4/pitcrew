# Team config of Gateway. `name` is the Team as qa_automation spells its `PROJECT_NAME`;
# the file is named after it, lowercased.
name: Gateway
allure:
  project_id: 3
  nightly_test_plan_id: 1387
  # Created by hand; its name must not contain `[Automation]`, or the `update_tests` job of
  # qa_automation syncs over it.
  rerun_test_plan_id: 12396
slack:
  # Incoming webhook of the Gateway channel, in the service environment.
  webhook_variable: SLACK_WEBHOOK_GATEWAY
features:
  rerun: true
  conclusion: true
  error_groups: true
