# For the `alembic` CLI only, e.g. `uv run alembic revision --autogenerate -m "..."` or
# `uv run alembic check`. The service migrates its DB on startup without this file; both take
# DATABASE_URL from the service settings (src/pitcrew/db/migrations/env.py).
[alembic]
script_location = %(here)s/src/pitcrew/db/migrations
path_separator = os
